[package]
name = "riel"
version = "0.2.0"
description = "Tareas en la barra de menú"
authors = ["Diego Partida"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "riel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
# Solo por el panel de guardar nativo del exportador. El archivo lo escribe un comando
# nuestro y no `tauri-plugin-fs`: así la app no se lleva permiso para leer el disco entero,
# que en una app que presume de no salir a la red es justo lo que no hay que pedir.
tauri-plugin-dialog = "2"
# El actualizador. Es el único sitio por el que Riel sale a la red, y solo para leer el
# `latest.json` de las releases del repo. La firma minisign de cada paquete la verifica el
# plugin contra `pubkey` antes de reemplazar nada, así que un GitHub comprometido no basta
# para colar un binario: harían falta también las llaves.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.6"
# Las mismas versiones que ya arrastra Tauri, así que no crecen el árbol. Se usan solo
# para instanciar `NSGlassEffectView`, que ninguna caja de Rust expone todavía.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  # El acento del sistema: `NSColor::controlAccentColor`, resuelto a sRGB bajo cada una de las
  # dos apariencias. Las tres van juntas — el color no se puede leer sin espacio al que
  # convertirlo ni sin apariencia bajo la que resolverlo.
  "NSAppearance",
  "NSColor",
  "NSColorSpace",
  "NSGraphics",
  "NSPanel",
  "NSResponder",
  "NSView",
  "NSWindow",
  # `NSWorkspace`: qué editores de código hay instalados (spec 13). Se pregunta al registro de
  # Launch Services por identificador de paquete, que es lo único que no cambia cuando una app
  # se renombra o se instala fuera de `/Applications`.
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSBundle",
  "NSError",
  # El aviso de que cambió el acento. Es *distribuido* y no el centro normal: lo emite el
  # sistema hacia todas las apps, no la nuestra hacia sí misma.
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSSet",
  "NSString",
  "NSURL",
] }
# Los avisos de la sección 7. `tauri-plugin-notification` no sirve en este macOS: su cadena
# acaba en `NSUserNotification`, que Apple retiró, y entrega nada devolviendo Ok. Esta es la
# API viva, y de paso la hora la lleva el sistema en vez de un `setTimeout` de la webview.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationAttachment",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
block2 = "0.6"
